<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Codium</title>
    
    <!-- External Resources -->
    <script src="https://kit.fontawesome.com/8279017fe2.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="/app/Styles/settings.css">
    <link rel="stylesheet" href="/app/Styles/elements2.css">

    <!-- Scripts -->
    <script type="module" src="/app/Scripts/main.js" defer></script>
    <script type="module" src="/app/Scripts/apiHandlers.js"></script>
    <script type="module" src="/app/Scripts/settings.js" defer></script>

    <meta name="menu-variant" content="new">
    <meta name="sidebar-active" content="settings">
</head>
<body>
    
    <div id="top-menu-container"></div>

    <div class="main-layout">
        <div id="sidebar-container"></div>

        <main class="content-area">
            <h1 data-i18n="settings-page.title"></h1>
            <div class="main-content">

                <div class="card profile-card" id="profileCard">
                    <div class="profile-info">
                        <img src="https://placehold.co/80/png" alt="Profile Picture" class="profile-avatar">
                        <div class="profile-details">
                            <h2 class="profile-name">Codeeitsbutlonger</h2>
                            <p class="profile-email">mail@its-codee.com</p>
                        </div>
                    </div>
                    <div class="profile-actions">
                        <button type="button" class="btn secondary" id="logOutBtn" data-i18n="buttons.log-out">Log-out</button>
                        <button type="button" class="btn primary" id="editProfileBtn" data-i18n="buttons.edit">Editează profilul</button>
                    </div>
                </div>

                <div class="card privacy-card" id="privacyCard">
                    <h2 data-i18n="settings-page.privacy-section.title">Confidențialitate</h2>
                    <div class="setting-item">
                        <label for="profile-visibility" data-i18n="settings-page.privacy-section.options.make-profile-private">Make my account private</label>
                        <!-- Toggle switch -->
                        <label class="switch">
                            <input type="checkbox" id="profile-visibility">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label for="two-factor-auth" data-i18n="settings-page.privacy-section.options.two-factor-authentication">Two-factor authentication</label>
                        <button type="button" class="btn secondary" id="two-factor-auth" data-i18n="buttons.enable">Enable</button>                    
                    </div>
                    <div class="setting-item">
                        <label for="request-data" data-i18n="settings-page.privacy-section.options.download-my-data">Download your data</label>
                        <button type="button" id="request-data" class="btn secondary" data-i18n="buttons.download-data">Download Data</button>
                    </div>
                    <div class="setting-item">
                        <label for="erase-data" data-i18n="settings-page.privacy-section.options.delete-my-data">Delete my data</label>
                        <button type="button" id="erase-data" class="btn danger" data-i18n="buttons.delete-data">Erase me</button>
                    </div>
                </div>

                <div class="card appearance-card" id="appearanceCard">
                    <h2 data-i18n="settings-page.appearance-section.title">Cuvant pentru appearance</h2>
                    <div class="setting-item">
                        <label for="dark-mode" data-i18n="settings-page.appearance-section.options.dark-mode">Dark mode</label>
                        <!-- Toggle switch -->
                        <label class="switch">
                            <input type="checkbox" id="dark-mode" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label for="font-size-options" data-i18n="settings-page.appearance-section.options.font-size">Font size</label>
                        <div class="font-size-options" id="font-size-options">
                            <button type="button" id="font-size-small" class="btn secondary"><span class="small-text" data-i18n="buttons.font-size-labels.small">Small</span></button>
                            <button type="button" id="font-size-medium" class="btn primary"><span class="medium-text active" data-i18n="buttons.font-size-labels.medium">Medium</span></button>
                            <button type="button" id="font-size-large" class="btn secondary"><span class="large-text" data-i18n="buttons.font-size-labels.large">Large</span></button>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label for="colorblind-mode" data-i18n="settings-page.appearance-section.options.color-blind-mode">Colorblind friendly mode</label>
                        <!-- Toggle switch -->
                        <label class="switch">
                            <input type="checkbox" id="colorblind-mode">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label for="contrast-mode" data-i18n="settings-page.appearance-section.options.high-contrast-mode">High contrast mode</label>
                        <!-- Toggle switch -->
                        <label class="switch">
                            <input type="checkbox" id="contrast-mode">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label for="hue-slider" data-i18n="settings-page.appearance-section.options.hue-slider">Hue slider</label>
                        <input type="range" class="hue-slider" id="hue-slider" name="hue-slider" min="0" max="360">
                    </div>
                </div>

                <div class="card other-stuff-card" id="otherStuffCard">
                    <h2 data-i18n="settings-page.other-stuff-section.title">Alte chestii</h2>
                    <div class="setting-item">
                        <label for="language-selector" data-i18n="settings-page.other-stuff-section.options.language">Limba de afișare</label>
                        <!-- Toggle switch -->
                        <div class="dropdown" id="language-selector-dropdown">
                            <button type="button" class="btn secondary dropdown-toggle" aria-expanded="false">
                                Română <i class="fa-solid fa-chevron-down"></i>
                            </button>
                            <div class="dropdown-menu" role="menu">
                                <div class="dropdown-item active" role="menuitem" tabindex="0" data-iso="ro">Română</div>
                                <div class="dropdown-item" role="menuitem" tabindex="0" data-iso="en">Engleză</div>
                                <div class="dropdown-item" role="menuitem" tabindex="0" data-iso="ca">Catalană (că de ce nu)</div>
                                <div class="dropdown-item" role="menuitem" tabindex="0" data-iso="de">Germană</div>
                            </div>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label for="support-form" data-i18n="settings-page.other-stuff-section.options.support">Formular de suport</label>
                        <!-- Toggle switch -->
                        <button type="button" id="support-form" class="btn primary" data-i18n="buttons.support-button">Contact Support</button>
                    </div>
                </div>

            </div>
            <footer class="settings-footer">
                <p data-i18n="settings-page.footer.copyright">&copy; 2026 Codium. Toallllte drepturile rezervate.</p>
                <p><span data-i18n="settings-page.footer.opensource">Codium este un proiect open-source.</span> <a href="https://github.com/codeeits/codium" data-i18n="settings-page.footer.contribute">Contribuie pe GitHub</a>.</p>
                <p data-i18n="settings-page.footer.made_with_love">made with &hearts; by andrew & codeeits ^_^</p>
            </footer>
        </main>
    </div>

</body>
</html>
