<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Codium</title>
    
    <!-- External Resources -->
    <script src="https://kit.fontawesome.com/8279017fe2.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <!--<link rel="stylesheet" href="Styles/elements.css">-->
    <link rel="stylesheet" href="Styles/elements2.css">
    <link rel="stylesheet" href="Styles/auth.css">
    <link rel="stylesheet" href="Styles/learning-animations.css">

    <!-- Scripts -->
    <script type="module" src="Scripts/main.js" defer></script>
    <script type="module" src="Scripts/apiHandlers.js"></script>
    <script type="module" src="Scripts/authLogic.js"></script>
    
    <meta name="menu-variant" content="new">
</head>
<body class="is-loading">
    <div id="top-menu-container"></div>
    
    <div class="main-content-auth main-layout">
        <div class="auth-nav left card">
            <div class="auth-header">
                <div class="auth-title">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <h2 data-i18n="login.title">Log in</h2>
                </div>
                <p data-i18n="login.placeholders.top-text">Welcome back! Please enter your details.</p>
            </div>
            <form id="loginForm" class="auth-form">
                <div class="modal-field">
                    <label for="email" class="input-label" data-i18n="login.email">Enter email:</label>
                    <div class="text-container input-field">
                        <input class="input-text" type="email" name="email" id="email" placeholder="e-mail" data-i18n-placeholder="login.placeholders.email" minlength="3" maxlength="254" autocomplete="email" required>
                        <i class="fa-solid fa-envelope input-icon"></i>
                    </div>
                </div>
                <div class="modal-field">
                    <label for="password" class="input-label" data-i18n="login.password">Password:</label>
                    <div class="text-container input-field">
                        <input class="input-text" type="password" name="password" id="password" placeholder="password" data-i18n-placeholder="login.placeholders.password" minlength="6" autocomplete="current-password" required>
                        <i class="fa-solid fa-key input-icon"></i>
                    </div>
                </div>
                
                <div class="auth-options">
                    <div class="auth-remember-me">
                        <input type="checkbox" name="remember" id="rememberMe">
                        <label for="rememberMe" data-i18n="login.remember_me">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password" data-i18n="login.forgot_password">Forgot password?</a>
                </div>
                <div class="auth-buttons">
                    <button type="button" class="btn secondary" data-i18n="buttons.register">Sign Up</button>
                    <input type="submit" value="Log in" class="btn primary" data-i18n-value="buttons.login">
                </div>
            </form>
        </div>
        <div class="auth-nav right card">
            <div class="floating-orbs">
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
            </div>
            <h2 data-i18n="app_name">codium</h2>
            <p data-i18n="welcome">Learn/ Code/ Compete/</p>
        </div>
    </div>
</body>
</html>
