<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="contact.meta.title">Contact - Codium</title>
    
    <!-- External Resources -->
    <script src="https://kit.fontawesome.com/8279017fe2.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="/app/Styles/elements2.css">
    <link rel="stylesheet" href="/app/Styles/landing.css">

    <!-- Scripts -->
    <script type="module" src="/app/Scripts/main.js" defer></script>
    <script type="module" src="/app/Scripts/apiHandlers.js"></script>
    <script src="/app/Scripts/contact.js" defer></script>

    <meta name="menu-variant" content="new-landing">
    <meta name="footer-variant" content="default">
</head>
<body class="landing-page">
    <div id="top-menu-container"></div>

    <div class="main-layout">
        <main class="content-area">
            <section class="landing-hero">
                <div class="hero-content">
                    <h1 class="landing-title">
                        <span data-i18n="landing.hero.title.learn">Învață</span> <span class="title-accent-python" data-i18n="landing.hero.title.python">Python</span><span data-i18n="landing.hero.title.interactive">. Interactiv,</span><br>
                        <span class="title-accent-simple" data-i18n="landing.hero.title.simple">simplu</span> <span data-i18n="landing.hero.title.and-at">și la</span> <span class="title-accent-focus" data-i18n="landing.hero.title.focus">obiect</span><span data-i18n="landing.hero.title.end">.</span>
                    </h1>
                    <p class="landing-description">
                        <span data-i18n="landing.hero.description.part-1">Platforma ta completă de programare, construită și aliniată 100% cu noua programă a Ministerului Educației, actualizată anul acesta. Învață</span>
                        <span class="landing-highlight" data-i18n="landing.hero.description.highlight">exact</span>
                        <span data-i18n="landing.hero.description.part-2">ce contează pentru școală, teste și bacalaureat.</span>
                    </p>
                    <div class="cta-btns">
                        <button type="button" class="cta-btn btn secondary" data-i18n="landing.hero.buttons.curriculum">Vezi curicula</button>
                        <button class="cta-btn btn primary" onclick="window.location.href='http://localhost:6767/app/login.html?redirect=%2Fapp%2Fuser2.html'">
                            <span data-i18n="landing.hero.buttons.start">Începe să programezi</span> <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="hero-decoration-background section-viewport-background">
                    <div class="binary-layer binary-layer-plain" aria-hidden="true">
                        <div class="binary-stream binary-stream-plain" id="binary-stream-plain"></div>
                    </div>
                    <div class="binary-layer binary-layer-masked" aria-hidden="true">
                        <div class="binary-stream binary-stream-masked" id="binary-stream-masked"></div>
                    </div>
                    <canvas class="particle-canvas" id="particle-canvas" aria-hidden="true"></canvas>
                </div>
            </section>
        </main>
    </div>

    <footer id="footer-container"></footer>
</body>
</html>
