<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecție - Codium</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="Styles/main.css">

    <!-- External Resources REQ. -->
    <script src="https://kit.fontawesome.com/8279017fe2.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- MathJax Configuration (Safari-compatible) -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            },
            startup: {
                ready: function () {
                    console.log('MathJax is ready');
                    MathJax.startup.defaultReady();
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script src="Scripts/main.js" defer></script>
    <script src="Scripts/apiHandlers.js"></script>
    <script src="Scripts/lessonsInterface.js"></script>

    <meta name="menu-variant" content="lesson">
</head>
<body>
    <div id="top-menu-container"></div>
    
    <div class="main-grid">
        <div class="content-area">
            <div id="lesson-content">
                <h1 id="lesson-title">Lesson 1</h1>
                <p>Author: <a href="#" id="lesson-auth" style="color: inherit;"></a></p>
                <p>Date Published: <span id="lesson-date"></span></p>
                <ul>
                    <li><p id="lesson-class"></p></li>
                    <li><p id="lesson-section"></p></li>
                    <li><p id="lesson-module"></p></li>
                </ul>
                <div id="account_buttons">
                    <button id="bookmarkButton" class="btn primary">Bookmark</button>
                </div>
                <hr>
                <div id="lesson-body"></div>
            </div>
        </div>
        
        <div id="lesson-sidebar">
            <h2 id="lesson-sidebar_title">Clasa a X-a</h2>

            <hr>

            <!-- automatic sidebar content will be generated here -->
        </div>
    </div>

    <style>
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 20rem;
            gap: 20px;
            min-height: calc(100vh - 60px);
        }

        .content-area {
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 3rem;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 10px;
            }
            
            .sidebar-menu {
                order: -1;
                height: auto;
            }
        }
    </style>
</body>
</html>
