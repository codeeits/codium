<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problemă - Codium</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/app/Styles/elements.css">
    <link rel="stylesheet" href="/app/Styles/main.css">

    <!-- External Resources REQ. -->
    <script src="https://kit.fontawesome.com/8279017fe2.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    
    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <!-- MathJax Configuration -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script type="module" src="/app/Scripts/main.js" defer></script>
    <script type="module" src="/app/Scripts/apiHandlers.js"></script>
    <script src="/app/Scripts/problemPage.js"></script>

    <meta name="menu-variant" content="problem">
</head>
<body>
    <div id="top-menu-container"></div>
    
    <div class="problems-page">
        <!-- Problem Info Card -->
        <div class="card problem-card">
            <div class="problem-header">
                <div class="problem-title-row">
                    <span class="problem-title" id="problem-title">Problema</span>
                    <span class="problem-tag" id="problem-source"></span>
                </div>
                <div class="problem-author">
                    <span class="problem-author-name">
                        <a href="#" id="problem-author"></a>
                    </span>
                </div>
            </div>
            <div class="problem-difficulty" id="problem-tags-container">
                <span class="difficulty-dot" id="problem-difficulty"></span>
                <span class="problem-tag" id="problem-module"></span>
                <span class="problem-tag" id="problem-section"></span>
            </div>
            <div class="problem-description" id="problem-description-container">
                <p id="problem-description"></p>
                <img id="problem-thumbnail" src="" alt="Problem Thumbnail">
            </div>
        </div>

        <!-- Tests Info Card -->
        <div class="card">
            <h3><i class="fas fa-vial"></i> Teste disponibile: <span id="tests-count">0</span></h3>
            <p><i class="fas fa-users"></i> Rezolvări: <span id="solutions-count">0</span></p>
            <p><i class="fas fa-check-circle"></i> Corecte: <span id="correct-solutions-count">0</span></p>
        </div>

        <!-- Code Editor Card -->
        <div class="card">
            <h3><i class="fas fa-code"></i> Rezolvare</h3>
            <div class="text-container">
                <textarea id="code-editor" placeholder="// Scrie codul tău aici..."></textarea>
            </div>
            <div class="modal-buttons">
                <button id="submit-code-btn" class="btn primary">
                    <i class="fas fa-paper-plane"></i> Trimite
                </button>
            </div>
        </div>

        <!-- Results Card -->
        <div class="card" id="results-section">
            <h3><i class="fas fa-chart-bar"></i> Rezultate</h3>
            <div id="results-container">
                <p id="results-placeholder">Rulează codul pentru a vedea rezultatele.</p>
            </div>
        </div>

        <!-- My Solutions Card -->
        <div class="card" id="sidebar-my-solutions">
            <h3>Soluțiile mele</h3>
            <div id="my-solutions-list">
                <p id="no-solutions-msg">Nu ai trimis încă nicio soluție.</p>
            </div>
        </div>

        <!-- Back Button -->
        <div class="problems-tabs">
            <button id="back-to-problems-btn" class="btn secondary">
                <i class="fas fa-chevron-left"></i> Înapoi la probleme
            </button>
        </div>
    </div>
</body>
</html>
