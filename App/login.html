<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Codium</title>
    
    <!-- External Resources -->
    <script src="https://kit.fontawesome.com/8279017fe2.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="Styles/elements.css">
    <link rel="stylesheet" href="Styles/main.css">

    <!-- Scripts -->
    <script src="Scripts/main.js" defer></script>
    <script src="Scripts/apiHandlers.js"></script>
    <script src="Scripts/loginHandler.js" defer></script>
    
    <meta name="menu-variant" content="default">
</head>
<body>
    <div id="top-menu-container"></div>
    
    <div class="main-content-auth">
        <div class="auth-nav left">
            <div class="auth-title">
                <i class="fa-solid fa-id-badge"></i>
                <h2>Log-in</h2>
            </div>
            <form id="loginForm" class="auth-form">
                <div class="text-container">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" name="email" id="email" placeholder="e-mail" required>
                </div>
                <div class="text-container">
                    <label for="password"><i class="fa-solid fa-key"></i></label>
                    <input type="password" name="password" id="password" placeholder="password" required>
                </div>
                <div class="auth-remember-me">
                    <input type="checkbox" name="remember" id="rememberMe">
                    <label for="rememberMe">remember me?</label>
                </div>
                <div class="auth-buttons">
                    <input type="submit" value="Log in" class="btn primary">
                    <button type="button" class="btn secondary">Sign Up</button>
                </div>
            </form>
        </div>
        <div class="auth-nav right">
            <div class="floating-orbs">
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
            </div>
            <h2>codium</h2>
            <p>Learn/ Code/ Compete/</p>
        </div>
    </div>
    
</body>
</html>
