<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Codium</title>
    
    <!-- External Resources -->
    <script src="https://kit.fontawesome.com/8279017fe2.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="Styles/elements2.css">
    <link rel="stylesheet" href="Styles/auth.css">

    <!-- Scripts -->
    <script type="module" src="Scripts/main.js" defer></script>
    <script type="module" src="Scripts/apiHandlers.js"></script>
    <script src="Scripts/signupHandler.js" defer></script>
    
    <meta name="menu-variant" content="new">
</head>
<body>
    <div id="top-menu-container"></div>
    
    <div class="main-content-auth main-layout">
        <div class="auth-nav left card">
            <div class="auth-header">
                <div class="auth-title">
                    <i class="fa-solid fa-user-plus"></i>
                    <h2 data-i18n="signup.title">Sign Up</h2>
                </div>
                <p data-i18n="signup.placeholders.top-text">Create an account to start coding.</p>
            </div>            
            <form id="signupForm" class="auth-form">
                <div class="modal-field">
                    <label for="username" class="input-label" data-i18n="signup.username">Choose a username:</label>
                    <div class="text-container input-field">
                        <input class="input-text" type="text" name="username" id="username" placeholder="username" data-i18n-placeholder="signup.placeholders.username" minlength="3" maxlength="50" autocomplete="username" required>
                        <i class="fa-solid fa-signature input-icon"></i>
                    </div>
                </div>
                <div class="modal-field">
                    <label for="email" class="input-label" data-i18n="signup.email">Enter email:</label>
                    <div class="text-container input-field">
                        <input class="input-text" type="email" name="email" id="email" placeholder="e-mail" data-i18n-placeholder="signup.placeholders.email" autocomplete="email" required>
                        <i class="fa-solid fa-envelope input-icon"></i>
                    </div>
                </div>
                <div class="modal-field">
                    <label for="password" class="input-label" data-i18n="signup.password">Password:</label>
                    <div class="text-container input-field">
                        <input class="input-text" type="password" name="password" id="password" placeholder="password" data-i18n-placeholder="signup.placeholders.password" minlength="6" autocomplete="new-password" required>
                        <i class="fa-solid fa-key input-icon"></i>
                    </div>
                </div>
                <div class="modal-field">
                    <label for="confirmPassword" class="input-label" data-i18n="signup.confirm_password">Confirm Password:</label>
                    <div class="text-container input-field">
                        <input class="input-text" type="password" name="confirmPassword" id="confirmPassword" placeholder="confirm password" data-i18n-placeholder="signup.placeholders.password" autocomplete="new-password" required>
                        <i class="fa-solid fa-key input-icon"></i>
                    </div>
                </div>
                <div class="auth-buttons">
                    <button type="button" class="btn secondary" data-i18n="buttons.login">Log In</button>
                    <input type="submit" value="Sign Up" class="btn primary" data-i18n-value="buttons.register">
                </div>
            </form>
        </div>
        <div class="auth-nav right card">
            <div class="floating-orbs">
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
            </div>
            <h2 data-i18n="app_name">codium</h2>
            <p data-i18n="welcome">Learn/ Code/ Compete/</p>
        </div>
    </div>

</body>
</html>
