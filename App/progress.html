                            datasets: [{
                                label: 'Skills',
                                data: [80, 90, 75, 85, 70],

                                pointBorderColor: '#fff',

                                pointHoverBorderColor: 'rgb(54, 162, 235)'
                            }]

                    });
                </script>
            </div>
            <div class="card heatmap-problems-graph">

            </div>
            <div class="card evolution-cookies">
                <h2>Evoluție</h2>
                <canvas id="evolutionChart"></canvas>

                    const evolutionDataInstance = window.apiService.getChart('evolutionChart', 'line', {

                        datasets: [{
                            label: 'Progres',

                            fill: true, // This enables the fill under the line
                            backgroundColor: 'rgba(153, 102, 255, 0.2)', // Fill color with opacity
                            borderColor: 'rgb(153, 102, 255)', // Line color
                            borderWidth: 2,
                            tension: 0.4, // Makes the line smooth/curved (use 0 for straight lines)
                            pointBackgroundColor: 'rgb(153, 102, 255)',
                            pointBorderColor: '#fff',
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: 'rgb(153, 102, 255)'
                        }]
                    });
                </script>
            </div>
            <div class="card history-solutions">
                <h2>Istoric rezolvări</h2>
                <img src="/app/Assets/history.png" alt="History of Solutions">
            </div>
        </main>
    </div>
