<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Upload - Codium</title>
    
    <script src="https://kit.fontawesome.com/8279017fe2.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/app/Styles/elements2.css">

    <script type="module" src="/app/Scripts/main.js" defer></script> 
    <script type="module" src="/app/Scripts/apiHandlers.js"></script>
    <script src="/app/Scripts/lessons/lessonsHandler.js" defer></script>
    
    <meta name="menu-variant" content="default">
</head>

<body>
    <div id="top-menu-container"></div>
    
    <main class="main-content" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="action-container" style="text-align: center;">
            <h2>Lesson Management</h2>
            <p style="margin-bottom: var(--gap-lg);">Click below to quickly upload a new lesson to the platform.</p>
            <button id="openUploadModalBtn" class="btn primary">
                <i class="fa-solid fa-cloud-upload-alt"></i> Open Quick Upload
            </button>
        </div>
    </main>

    <script type="module">
        import { ModalEngine } from '/app/Scripts/modal/modalMain.js';
        import { ModalHelpers } from '/app/Scripts/modal/modalHelpers.js';

        document.addEventListener('DOMContentLoaded', () => {
            const engine = new ModalEngine();
            const uploadBtn = document.getElementById('openUploadModalBtn');

            if (uploadBtn) {
                uploadBtn.addEventListener('click', () => {
                    ModalHelpers.LessonUpload.openModal({
                        engine,
                        onConfirm: (formElement) => {
                            // Note: `lessonsHandler.js` logic can hook into this event
                            // or you can handle form submission logic directly here.
                            const formData = new FormData(formElement);
                            
                            // Trigger a global event that your existing code can listen for
                            document.dispatchEvent(new CustomEvent('codium:lesson-upload-submit', { 
                                detail: { formData, formElement } 
                            }));
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
